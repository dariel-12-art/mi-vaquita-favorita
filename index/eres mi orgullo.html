<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Vaquita Favorita 🐮</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

        :root {
            --pastel-pink: #ffc8dd;
            --pastel-blue: #bde0fe;
            --pastel-cream: #fff1e6;
            --neon-soft: #ffafcc;
            --text-dark: #5d4037;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #fff0f5, #e0f7fa);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Para el efecto 3D */
        }

        /* Fondo animado con manchas de vaca sutiles */
        .bg-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(var(--pastel-pink) 15%, transparent 16%),
                radial-gradient(var(--pastel-blue) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.4;
            z-index: -1;
            animation: moveBg 20s linear infinite;
        }

        @keyframes moveBg {
            from { background-position: 0 0, 30px 30px; }
            to { background-position: 60px 60px, 90px 90px; }
        }

        /* Tarjeta Principal Flotante */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 4px solid white;
            border-radius: 40px;
            padding: 40px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 20px 50px rgba(255, 175, 204, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.8);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            z-index: 10;
        }

        /* Decoración de esquinas con vacas */
        .corner-cow {
            position: absolute;
            font-size: 3rem;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
            animation: bounceSlow 3s infinite ease-in-out;
        }
        .top-left { top: -20px; left: -20px; transform: rotate(-15deg); }
        .bottom-right { bottom: -20px; right: -20px; transform: rotate(15deg); }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--neon-soft);
            font-size: 2.2rem;
            margin: 10px 0;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px var(--pastel-pink);
            letter-spacing: 1px;
        }

        .main-cow {
            font-size: 6rem;
            margin: 10px auto;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
            filter: drop-shadow(0 10px 15px rgba(255, 175, 204, 0.4));
            animation: floatCow 4s ease-in-out infinite;
        }

        .main-cow:hover {
            transform: scale(1.1) rotate(10deg);
        }

        .main-cow:active {
            transform: scale(0.95);
        }

        .message-box {
            background: linear-gradient(135deg, #fff, var(--pastel-cream));
            border: 3px dashed var(--pastel-pink);
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            color: var(--text-dark);
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            box-shadow: inset 0 0 15px rgba(255, 200, 221, 0.3);
            position: relative;
        }

        .message-box::after {
            content: '🐮';
            position: absolute;
            bottom: -15px;
            right: 20px;
            font-size: 2rem;
            background: white;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Botones Coquetos y Futuristas */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .cute-btn {
            background: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
            color: var(--neon-soft);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 2px solid var(--pastel-pink);
        }

        .cute-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--pastel-pink);
            z-index: -1;
            transition: transform 0.3s ease;
            transform: scaleX(0);
            transform-origin: right;
        }

        .cute-btn:hover {
            color: white;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px rgba(255, 175, 204, 0.4);
        }

        .cute-btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .cute-btn.secondary {
            border-color: var(--pastel-blue);
            color: #8ecae6;
        }
        .cute-btn.secondary::before {
            background: var(--pastel-blue);
        }
        .cute-btn.secondary:hover {
            box-shadow: 0 10px 20px rgba(142, 202, 230, 0.4);
        }

        /* Animaciones */
        @keyframes floatCow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0) rotate(-15deg); }
            50% { transform: translateY(-10px) rotate(-10deg); }
        }

        /* Partículas flotantes */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: flyUp 3s forwards;
            font-size: 2rem;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-150px) scale(1.2) rotate(360deg); opacity: 0; }
        }

        .hidden-msg {
            display: none;
            margin-top: 15px;
            color: var(--pastel-blue);
            font-weight: bold;
            font-size: 1.1rem;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div class="card" id="card">
        <!-- Vacas decorativas -->
        <div class="corner-cow top-left">🐄</div>
        <div class="corner-cow bottom-right">🐮</div>

        <h1>¡Hola Princesa! 👑</h1>
        
        <!-- Vaca Principal Interactiva -->
        <div class="main-cow" onclick="makeCowKiss()">🐮</div>
        <p style="font-size: 0.9rem; color: #888; margin-top: -10px;">(Tócame para un beso)</p>

        <div class="message-box">
            "Te quiero mucho y estoy muy orgulloso de la increíble chica que eres princesa"
        </div>

        <div class="btn-group">
            <button class="cute-btn" onclick="rainCows()">✨ ¡Lluvia de Vacas Enamoradas! ✨</button>
            <button class="cute-btn secondary" onclick="toggleSecret()">💌 Ver Mensaje Secreto</button>
        </div>

        <div id="secret" class="hidden-msg">
            Eres mi vaquita favorita en todo el universo. 🐾<br>
            ¡Nunca dejes de ser tan increíble!
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const cow = document.querySelector('.main-cow');
        
        // Efecto 3D suave al mover el mouse
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 30;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Función para crear partículas (vacas y corazones)
        function createParticle(x, y) {
            const emojis = ['🐮', '🐄', '❤️', '💖', '🌸', '✨', ''];
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Posición inicial
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            // Aleatoriedad en dirección
            const randomX = (Math.random() - 0.5) * 100;
            particle.style.setProperty('--tx', randomX + 'px');
            
            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 3000);
        }

        // Al hacer click en la vaca grande
        function makeCowKiss() {
            const rect = cow.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Cambiar emoji temporalmente
            const originalEmoji = cow.innerText;
            cow.innerText = '😘';
            setTimeout(() => cow.innerText = originalEmoji, 500);

            // Explosión de partículas
            for(let i=0; i<15; i++) {
                setTimeout(() => {
                    createParticle(centerX, centerY);
                }, i * 50);
            }
        }

        // Botón Lluvia
        function rainCows() {
            for(let i=0; i<40; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = window.innerHeight + 50;
                    // Creamos la partícula desde abajo hacia arriba
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    particle.innerText = ['', '❤️', '🐄'][Math.floor(Math.random() * 3)];
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 4000);
                }, i * 100);
            }
        }

        // Botón Secreto
        function toggleSecret() {
            const secret = document.getElementById('secret');
            const btn = document.querySelector('.secondary');
            
            if (secret.style.display === 'block') {
                secret.style.display = 'none';
                btn.innerText = '💌 Ver Mensaje Secreto';
            } else {
                secret.style.display = 'block';
                btn.innerText = ' Ocultar Mensaje';
                makeCowKiss(); // Pequeña celebración al revelar
            }
        }

        // Lluvia suave automática de fondo
        setInterval(() => {
            if(Math.random() > 0.8) {
                const x = Math.random() * window.innerWidth;
                createParticle(x, window.innerHeight);
            }
        }, 2000);

    </script>
</body>
</html>
